name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # there is no requirements.txt at the root, and the default glob does
          # not find this one on its own
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      # The SNMP layer imports no Home Assistant, so the whole suite runs
      # against recorded snapshots without installing HA or touching a network.
      - run: pytest -v

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
